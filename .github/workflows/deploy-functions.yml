name: Deploy Cloud Functions

on:
  push:
    branches: [main, hindi-language-support, claude/hindi-language-support-y701g8]
    paths:
      - 'vertex-ai-backend/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: vertex-ai-backend
        run: npm install

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase (production, main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: npx firebase-tools deploy --only functions --project student-database-74297 --non-interactive

      - name: Deploy Hindi test functions only (Hindi support branches)
        if: github.ref == 'refs/heads/hindi-language-support' || github.ref == 'refs/heads/claude/hindi-language-support-y701g8'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: npx firebase-tools deploy --only functions:processGradingJobHindiTest,functions:processGradingJobHindiSarvamTest,functions:processGradingHindiSarvamProd --project student-database-74297 --non-interactive
