name: Deploy Cloud Functions

on:
  push:
    branches: [main, hindi-language-support]
    paths:
      - 'vertex-ai-backend/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: vertex-ai-backend
        run: npm install

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase (production, main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        # Scoped to the exact functions this repo's index.js exports (not the blanket
        # `--only functions`, which tries to delete anything live-but-not-in-source and
        # aborts in non-interactive mode). Production currently also has functions this
        # repo doesn't know about (processStudentGradingJob, processGradingHindiSarvamProd,
        # processGradingJobHindiSarvamTest, callVertexAI) — deliberately left untouched here.
        # Update this list if index.js gains/loses an export.
        run: npx firebase-tools deploy --only functions:processGradingJob,functions:getHomeworkSubmissionReport,functions:extractAssessmentQuestions --project student-database-74297 --non-interactive

      - name: Deploy Hindi test function only (hindi-language-support branch)
        if: github.ref == 'refs/heads/hindi-language-support'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
        run: npx firebase-tools deploy --only functions:processGradingJobHindiTest --project student-database-74297 --non-interactive
